build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  python_packages:
    - "torch==2.1.2 --index-url https://download.pytorch.org/whl/cu121"
    - "torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cu121"
    - "numpy<2.0"
