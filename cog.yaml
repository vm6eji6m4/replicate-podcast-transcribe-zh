build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - ffmpeg
  python_packages:
    - --extra-index-url=https://download.pytorch.org/whl/cu121
    - torch==2.1.2
    - torchaudio==2.1.2
    - numpy<2.0
    - pyannote.audio==3.1.1
    - faster-whisper>=1.0.0
    - python-dotenv>=1.0

predict: predict.py:Predictor
