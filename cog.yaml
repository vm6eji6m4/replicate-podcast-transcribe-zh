build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - ffmpeg
  python_packages:
    - --extra-index-url=https://download.pytorch.org/whl/cu121
    - torch==2.1.2
    - torchaudio==2.1.2
    - numpy<2.0
    - huggingface-hub<0.24
    - faster-whisper>=1.0.0
    - python-dotenv>=1.0
  run:
    # Install pyannote.audio via direct pip (Cog 0.9.8 misparses dotted package names).
    # Re-pin numpy<2 + huggingface-hub<0.24 to prevent transitive upgrades:
    # - pyannote 3.1.1 internally calls hf_hub_download(use_auth_token=...),
    #   which was REMOVED in huggingface-hub >= 0.24
    - pip install "pyannote.audio==3.1.1" "numpy<2" "huggingface-hub<0.24"

predict: predict.py:Predictor
